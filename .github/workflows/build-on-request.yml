name: Build on request
on:
  workflow_dispatch:

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild and add to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download legacy 7-Zip for vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-downloads'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $archive = Join-Path $downloads '7z2107-extra.7z'
          $url = 'https://sourceforge.net/projects/sevenzip/files/7-Zip/21.07/7z2107-extra.7z/download'
          curl.exe -fL --retry 3 --retry-delay 3 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Could not download 7-Zip archive' }
          $bytes = [System.IO.File]::ReadAllBytes($archive)
          if ($bytes.Length -lt 100000 -or [BitConverter]::ToString($bytes[0..5]) -ne '37-7A-BC-AF-27-1C') {
            throw 'Downloaded file is not a valid 7z archive'
          }
          "VCPKG_DOWNLOADS=$downloads" >> $env:GITHUB_ENV

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg/
          vcpkgTriplet: x86-windows-static
          vcpkgGitCommitId: 3b3bd424827a1f7f4813216f6b32b6c61e386b2e
          vcpkgArguments: >
            boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem
            luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl

      - name: Integrate vcpkg
        shell: pwsh
        run: |
          & "${{ runner.workspace }}/vcpkg/vcpkg.exe" integrate install

      - name: Compile otclient_dx
        timeout-minutes: 20
        shell: pwsh
        run: |
          Set-Location vc16
          MSBuild /property:Configuration=DirectX /p:BUILD_REVISION=${{ github.run_number }}

      - name: Compile otclient_gl
        timeout-minutes: 20
        shell: pwsh
        run: |
          Set-Location vc16
          MSBuild /property:Configuration=OpenGL /p:BUILD_REVISION=${{ github.run_number }}

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: tibora-otcv8-windows
          path: |
            otclient_gl.exe
            otclient_dx.exe
          if-no-files-found: error
