
name: Build Tibora OTCv8 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg
        run: |
          git clone --branch 2026.10.16 --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          $packages = @(
            "boost-iostreams"
            "boost-asio"
            "boost-beast"
            "boost-system"
            "boost-variant"
            "boost-lockfree"
            "boost-process"
            "boost-program-options"
            "boost-uuid"
            "boost-filesystem"
            "luajit"
            "glew"
            "physfs"
            "openal-soft"
            "libogg"
            "libvorbis"
            "zlib"
            "libzip"
            "bzip2"
            "openssl"
          )

          & "$env:VCPKG_ROOT\vcpkg.exe" install @packages --triplet x86-windows-static

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed"
          }

      - name: Verify dependencies
        run: |
          $root = Join-Path $env:VCPKG_ROOT "installed\x86-windows-static"

          $boostHeader = Join-Path $root "include\boost\asio\io_context.hpp"
          $libDir = Join-Path $root "lib"

          if (-not (Test-Path $boostHeader)) {
            throw "Boost.Asio headers missing"
          }

          if (-not (Test-Path $libDir)) {
            throw "Vcpkg library directory missing"
          }

          Write-Host "Boost verified"
          Write-Host "Library directory: $libDir"

      - name: Integrate vcpkg
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg integration failed"
          }

      - name: Resolve linker libraries automatically
        run: |
          $libDir = Join-Path $env:VCPKG_ROOT "installed\x86-windows-static\lib"
          $settingsPath = "vc16/settings.props"
          $projectPath = "vc16/otclient.vcxproj"

          if (-not (Test-Path $settingsPath)) {
            throw "Cannot find vc16/settings.props"
          }

          if (-not (Test-Path $projectPath)) {
            throw "Cannot find vc16/otclient.vcxproj"
          }

          $available = @(
            Get-ChildItem -Path $libDir -Filter "*.lib" -File |
            Select-Object -ExpandProperty Name
          )

          Write-Host "===== INSTALLED LIBRARIES ====="

          $available | ForEach-Object {
            Write-Host $_
          }

          $settings = [System.IO.File]::ReadAllText(
            (Resolve-Path $settingsPath).Path
          )

          $libraries = [ordered]@{
            "zlib.lib" = @(
              "zlib.lib",
              "zlibstatic.lib",
              "zs.lib",
              "z.lib"
            )
            "libssl.lib" = @(
              "libssl.lib",
              "ssl.lib"
            )
            "physfs-static.lib" = @(
              "physfs-static.lib",
              "physfs.lib"
            )
            "lua51.lib" = @(
              "lua51.lib",
              "luajit.lib",
              "lua5.1.lib"
            )
          }

          $missing = @()

          foreach ($legacy in $libraries.Keys) {
            $selected = $null

            foreach ($candidate in $libraries[$legacy]) {
              if ($available -contains $candidate) {
                $selected = $candidate
                break
              }
            }

            if (-not $selected) {
              $missing += $legacy
              Write-Host "MISSING: $legacy"
              continue
            }

            Write-Host "LINKER: $legacy -> $selected"

            $escaped = [regex]::Escape($legacy)
            $pattern = "(?i)$escaped(?=\s*;)"

            $settings = [regex]::Replace(
              $settings,
              $pattern,
              $selected
            )
          }

          if ($missing.Count -gt 0) {
            Write-Host "===== MISSING LIBRARIES ====="

            $missing | ForEach-Object {
              Write-Host $_
            }

            throw "Required libraries could not be located"
          }

          [System.IO.File]::WriteAllText(
            (Resolve-Path $settingsPath).Path,
            $settings,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Settings linker configuration updated"

          # Detect the actual GLEW library installed by vcpkg.

          $project = [System.IO.File]::ReadAllText(
            (Resolve-Path $projectPath).Path
          )

          $glewNames = @(
            "glew32.lib",
            "glew32s.lib",
            "GLEW.lib",
            "glew.lib"
          )

          $glewLib = $glewNames |
            Where-Object { $available -contains $_ } |
            Select-Object -First 1

          if (-not $glewLib) {
            $found = @(
              $available | Where-Object { $_ -match "glew" }
            )

            Write-Host "Available GLEW-like libraries:"
            $found | ForEach-Object { Write-Host $_ }

            throw "GLEW library not found"
          }

          Write-Host "GLEW linker library: $glewLib"

          $project = $project.Replace(
            "glew32.lib;opengl32.lib",
            "$glewLib;opengl32.lib"
          )

          [System.IO.File]::WriteAllText(
            (Resolve-Path $projectPath).Path,
            $project,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Project linker configuration updated"

      - name: Prepare diagnostic logs
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Compile DirectX and collect errors
        id: directx
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $env:INCLUDE = "$env:VCPKG_ROOT\installed\x86-windows-static\include;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_ROOT\installed\x86-windows-static\lib;$env:LIB"

          Push-Location vc16

          try {
            msbuild otclient.sln /m /p:Configuration=DirectX /p:Platform=Win32 /p:PlatformToolset=v143 /p:VcpkgRoot="$env:VCPKG_ROOT\" /p:VcpkgTriplet=x86-windows-static /p:MultiProcessorCompilation=true /p:BUILD_REVISION=${{ github.run_number }} /verbosity:normal /fl "/flp:logfile=../logs/directx.log;verbosity=normal"

            $result = $LASTEXITCODE

            if ($result -ne 0) {
              Write-Host "DirectX build failed"
            }

            exit $result
          }
          finally {
            Pop-Location
          }

      - name: Compile OpenGL and collect errors
        id: opengl
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $env:INCLUDE = "$env:VCPKG_ROOT\installed\x86-windows-static\include;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_ROOT\installed\x86-windows-static\lib;$env:LIB"

          Push-Location vc16

          try {
            msbuild otclient.sln /m /p:Configuration=OpenGL /p:Platform=Win32 /p:PlatformToolset=v143 /p:VcpkgRoot="$env:VCPKG_ROOT\" /p:VcpkgTriplet=x86-windows-static /p:MultiProcessorCompilation=true /p:BUILD_REVISION=${{ github.run_number }} /verbosity:normal /fl "/flp:logfile=../logs/opengl.log;verbosity=normal"

            $result = $LASTEXITCODE

            if ($result -ne 0) {
              Write-Host "OpenGL build failed"
            }

            exit $result
          }
          finally {
            Pop-Location
          }

      - name: Collect all compiler errors
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

          $allErrors = @()

          foreach ($file in @("logs/directx.log", "logs/opengl.log")) {
            if (Test-Path $file) {
              $matches = @(
                Get-Content $file | Where-Object {
                  $_ -match 'error C[0-9]+|fatal error|error LNK[0-9]+|error MSB[0-9]+'
                }
              )

              $allErrors += "===== $file ====="
              $allErrors += $matches

              Write-Host "Errors in ${file}: $($matches.Count)"
            }
          }

          $allErrors | Set-Content "logs/ALL_ERRORS.txt" -Encoding UTF8

          Get-Content "logs/ALL_ERRORS.txt"

      - name: Upload all diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tibora-OTCv8-Errors
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tibora-OTCv8-Windows
          path: |
            otclient_dx.exe
            otclient_gl.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Final build status
        if: always()
        run: |
          if ("${{ steps.directx.outcome }}" -ne "success" -or
              "${{ steps.opengl.outcome }}" -ne "success") {
            throw "One or more builds failed. Check diagnostic logs."
          }

          Write-Host "Tibora OTCv8 Windows build successful!"
