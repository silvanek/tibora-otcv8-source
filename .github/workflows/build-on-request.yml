
name: Build Tibora OTCv8 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg
        run: |
          git clone --branch 2026.10.16 --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          $packages = @(
            "boost-iostreams"
            "boost-asio"
            "boost-beast"
            "boost-system"
            "boost-variant"
            "boost-lockfree"
            "boost-process"
            "boost-program-options"
            "boost-uuid"
            "boost-filesystem"
            "luajit"
            "glew"
            "physfs"
            "openal-soft"
            "libogg"
            "libvorbis"
            "zlib"
            "libzip"
            "bzip2"
            "openssl"
          )

          & "$env:VCPKG_ROOT\vcpkg.exe" install @packages --triplet x86-windows-static

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed"
          }

      - name: Verify Boost headers
        run: |
          $includeDir = Join-Path $env:VCPKG_ROOT "installed\x86-windows-static\include"
          $boostHeader = Join-Path $includeDir "boost\asio\io_context.hpp"

          if (-not (Test-Path $boostHeader)) {
            throw "Missing Boost header: $boostHeader"
          }

          Write-Host "Boost headers verified"
          Write-Host "Include directory: $includeDir"

      - name: Integrate vcpkg
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg integration failed"
          }

      - name: Compile DirectX
        timeout-minutes: 25
        run: |
          $env:INCLUDE = "$env:VCPKG_ROOT\installed\x86-windows-static\include;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_ROOT\installed\x86-windows-static\lib;$env:LIB"

          Push-Location vc16
          try {
            msbuild /m /p:Configuration=DirectX /p:Platform=Win32 /p:VcpkgRoot="$env:VCPKG_ROOT\" /p:VcpkgTriplet=x86-windows-static /p:BUILD_REVISION=${{ github.run_number }}

            if ($LASTEXITCODE -ne 0) {
              throw "DirectX compilation failed"
            }
          }
          finally {
            Pop-Location
          }

      - name: Compile OpenGL
        timeout-minutes: 25
        run: |
          $env:INCLUDE = "$env:VCPKG_ROOT\installed\x86-windows-static\include;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_ROOT\installed\x86-windows-static\lib;$env:LIB"

          Push-Location vc16
          try {
            msbuild /m /p:Configuration=OpenGL /p:Platform=Win32 /p:VcpkgRoot="$env:VCPKG_ROOT\" /p:VcpkgTriplet=x86-windows-static /p:BUILD_REVISION=${{ github.run_number }}

            if ($LASTEXITCODE -ne 0) {
              throw "OpenGL compilation failed"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: Tibora-OTCv8-Windows
          path: |
            otclient_dx.exe
            otclient_gl.exe
          if-no-files-found: error
          retention-days: 7
