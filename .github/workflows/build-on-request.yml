
name: Build Tibora OTCv8 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg
        run: |
          git clone --branch 2026.10.16 --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          $packages = @(
            "boost-iostreams"
            "boost-asio"
            "boost-beast"
            "boost-system"
            "boost-variant"
            "boost-lockfree"
            "boost-process"
            "boost-program-options"
            "boost-uuid"
            "boost-filesystem"
            "luajit"
            "glew"
            "physfs"
            "openal-soft"
            "libogg"
            "libvorbis"
            "zlib"
            "libzip"
            "bzip2"
            "openssl"
          )

          & "$env:VCPKG_ROOT\vcpkg.exe" install @packages --triplet x86-windows-static

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed"
          }

      - name: Verify Boost headers
        run: |
          $includeDir = Join-Path $env:VCPKG_ROOT "installed\x86-windows-static\include"
          $boostHeader = Join-Path $includeDir "boost\asio\io_context.hpp"

          if (-not (Test-Path $boostHeader)) {
            throw "Missing Boost header: $boostHeader"
          }

          Write-Host "Boost headers verified"

      - name: Integrate vcpkg
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg integration failed"
          }

      - name: Prepare diagnostic logs
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Compile DirectX and collect errors
        id: directx
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $env:INCLUDE = "$env:VCPKG_ROOT\installed\x86-windows-static\include;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_ROOT\installed\x86-windows-static\lib;$env:LIB"

          Push-Location vc16
          try {
            msbuild otclient.sln /m /p:Configuration=DirectX /p:Platform=Win32 /p:VcpkgRoot="$env:VCPKG_ROOT\" /p:VcpkgTriplet=x86-windows-static /p:MultiProcessorCompilation=true /p:BUILD_REVISION=${{ github.run_number }} /verbosity:normal /fl "/flp:logfile=../logs/directx.log;verbosity=normal"

            $result = $LASTEXITCODE
            if ($result -ne 0) {
              Write-Host "DirectX failed. Log saved."
            }

            exit $result
          }
          finally {
            Pop-Location
          }

      - name: Compile OpenGL and collect errors
        id: opengl
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $env:INCLUDE = "$env:VCPKG_ROOT\installed\x86-windows-static\include;$env:INCLUDE"
          $env:LIB = "$env:VCPKG_ROOT\installed\x86-windows-static\lib;$env:LIB"

          Push-Location vc16
          try {
            msbuild otclient.sln /m /p:Configuration=OpenGL /p:Platform=Win32 /p:VcpkgRoot="$env:VCPKG_ROOT\" /p:VcpkgTriplet=x86-windows-static /p:MultiProcessorCompilation=true /p:BUILD_REVISION=${{ github.run_number }} /verbosity:normal /fl "/flp:logfile=../logs/opengl.log;verbosity=normal"

            $result = $LASTEXITCODE
            if ($result -ne 0) {
              Write-Host "OpenGL failed. Log saved."
            }

            exit $result
          }
          finally {
            Pop-Location
          }

      - name: Collect all compiler errors
        if: always()
        run: |
          $allErrors = @()

          foreach ($file in @("logs/directx.log", "logs/opengl.log")) {
            if (Test-Path $file) {
              $matches = Get-Content $file | Where-Object {
                $_ -match 'error C[0-9]+|fatal error|error LNK[0-9]+|MSB[0-9]+'
              }

              $allErrors += "===== $file ====="
              $allErrors += $matches

              Write-Host "Errors found in ${file}: $($matches.Count)"
            }
          }

          $allErrors | Set-Content -Path "logs/ALL_ERRORS.txt" -Encoding UTF8

          Get-Content "logs/ALL_ERRORS.txt"

      - name: Upload all diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tibora-OTCv8-Errors
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tibora-OTCv8-Windows
          path: |
            otclient_dx.exe
            otclient_gl.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Final build status
        if: always()
        run: |
          if ("${{ steps.directx.outcome }}" -ne "success" -or
              "${{ steps.opengl.outcome }}" -ne "success") {
            throw "One or more builds failed. Download Tibora-OTCv8-Errors."
          }
